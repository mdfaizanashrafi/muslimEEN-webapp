# =============================================================================
# MUSLIMEEN PRODUCTION CI/CD PIPELINE
# =============================================================================
name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

env:
  NODE_VERSION: '18'
  BACKEND_DIR: 'backend'
  FRONTEND_DIR: 'frontend'
  CACHE_BUST: '2026-03-21-v1'

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muslimeen_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Run unit tests
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: muslimeen_test
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: test-secret-key-for-ci-only
        run: npm run test:unit -- --coverage

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f "dist/server.js" ]; then
            echo "ERROR: dist/server.js not found!"
            exit 1
          fi
          echo "Build verification passed ✓"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: ${{ env.BACKEND_DIR }}/dist/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ env.FRONTEND_DIR }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/frontend/package-lock.json') }}-${{ hashFiles('**/frontend/**/*.js', '**/frontend/**/*.jsx', '**/frontend/**/*.ts', '**/frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        env:
          NEXT_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.PROD_API_URL || secrets.STAGING_API_URL }}
          NEXT_PUBLIC_APP_NAME: MuslimEEN
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d ".next" ]; then
            echo "ERROR: .next directory not found!"
            exit 1
          fi
          echo "Build verification passed ✓"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/.next/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          npm audit --audit-level=moderate || true
          npm audit --audit-level=high --json > audit-backend.json || true

      - name: Audit frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm audit --audit-level=moderate || true
          npm audit --audit-level=high --json > audit-frontend.json || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            ${{ env.BACKEND_DIR }}/audit-backend.json
            ${{ env.FRONTEND_DIR }}/audit-frontend.json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'typescript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [backend-ci, security-scan, codeql]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Deploy to Render
        id: deploy
        run: |
          echo "Triggering Render deployment..."
          RESPONSE=$(curl -s -X POST ${{ secrets.RENDER_DEPLOY_HOOK }})
          echo "Deploy hook response: $RESPONSE"
          echo "url=https://api.muslimeen.org" >> $GITHUB_OUTPUT

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 60

      - name: Health check
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://api.muslimeen.org/api/health || echo "000")
            
            if [ "$RESPONSE" = "200" ]; then
              echo "Health check passed ✓"
              exit 0
            fi
            
            echo "Health check failed (HTTP $RESPONSE). Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          
          echo "Health check failed after $MAX_RETRIES attempts!"
          exit 1

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [frontend-ci, security-scan, codeql]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel --token $VERCEL_TOKEN --prod --yes
          echo "url=https://muslimeen.org" >> $GITHUB_OUTPUT

      - name: Smoke test
        run: |
          MAX_RETRIES=5
          RETRY_DELAY=30
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Smoke test attempt $i/$MAX_RETRIES..."
            
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://muslimeen.org || echo "000")
            
            if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "307" ]; then
              echo "Smoke test passed ✓"
              exit 0
            fi
            
            echo "Smoke test failed (HTTP $RESPONSE). Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
          
          echo "Smoke test failed after $MAX_RETRIES attempts!"
          exit 1

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Notify success
        if: needs.deploy-backend.result == 'success' && needs.deploy-frontend.result == 'success'
        run: |
          echo "Deployment successful!"
          echo "Backend: https://api.muslimeen.org"
          echo "Frontend: https://muslimeen.org"

      - name: Notify failure
        if: needs.deploy-backend.result == 'failure' || needs.deploy-frontend.result == 'failure'
        run: |
          echo "Deployment failed! Check logs for details."
          exit 1
