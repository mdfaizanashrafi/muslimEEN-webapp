# =============================================================================
# MUSLIMEEN PULL REQUEST VALIDATION WORKFLOW
# =============================================================================
name: PR Validation

on:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  deployments: write

env:
  NODE_VERSION: '18'
  BACKEND_DIR: 'backend'
  FRONTEND_DIR: 'frontend'
  CACHE_BUST: '2026-03-21-v1'

jobs:
  backend-pr-check:
    name: Backend PR Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Build
        run: npm run build

  frontend-pr-check:
    name: Frontend PR Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: ${{ env.FRONTEND_DIR }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/frontend/package-lock.json') }}-${{ hashFiles('**/frontend/**/*.tsx') }}

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run ESLint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:3001' }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [frontend-pr-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --prefer-offline --no-audit

      - name: Build and analyze bundle
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:3001' }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build
          echo "=== Bundle Size Analysis ==="
          du -sh .next/static/ || true
          du -sh .next/server/ || true
          echo "============================"

  pr-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: [backend-pr-check, frontend-pr-check]
    if: always()

    steps:
      - name: Post success comment
        if: needs.backend-pr-check.result == 'success' && needs.frontend-pr-check.result == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **PR Validation Passed**\n\n- Backend: ✓ Lint, ✓ Type-check, ✓ Build\n- Frontend: ✓ Lint, ✓ Build\n\nReady for review!'
            })

      - name: Post failure comment
        if: needs.backend-pr-check.result == 'failure' || needs.frontend-pr-check.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **PR Validation Failed**\n\nPlease check the workflow logs and fix the issues before requesting review.'
            })
