services:
  - type: web
    name: muslimeen-api
    runtime: node
    repo: https://github.com/your-org/muslimeen
    branch: main
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: muslimeen-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: muslimeen-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: muslimeen-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: muslimeen-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: muslimeen-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: muslimeen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: muslimeen-redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://muslimeen.vercel.app
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: muslimeen-db
    databaseName: muslimeen
    user: muslimeen
    plan: free

redis:
  - name: muslimeen-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
