# MuslimEEN Backend Deployment Configuration for Render
# This file enables Infrastructure as Code deployment on Render

services:
  # Web Service - MuslimEEN Backend API
  - type: web
    name: muslimeen-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CSRF_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      # Database configuration - link to PostgreSQL database
      - key: DB_HOST
        fromDatabase:
          name: muslimeen-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: muslimeen-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: muslimeen-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: muslimeen-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: muslimeen-db
          property: password
      # CORS - allow your Vercel frontend
      - key: FRONTEND_URL
        value: https://your-app.vercel.app
    autoDeploy: true

  # Background Worker (optional - for future use)
  # - type: worker
  #   name: muslimeen-worker
  #   runtime: node
  #   plan: starter
  #   buildCommand: npm install && npm run build
  #   startCommand: npm run worker
  #   envVars:
  #     - key: NODE_ENV
  #       value: production

  # Cron Job (optional - for future scheduled tasks)
  # - type: cron
  #   name: muslimeen-cron
  #   runtime: node
  #   plan: starter
  #   buildCommand: npm install && npm run build
  #   startCommand: npm run cron
  #   schedule: "0 0 * * *"

databases:
  # PostgreSQL Database
  - name: muslimeen-db
    plan: starter
    region: oregon
    postgresMajorVersion: 15
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
